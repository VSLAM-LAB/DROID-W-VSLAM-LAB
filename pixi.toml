[workspace]
authors = ["alejandrofontan <fontanvillacampa@gmail.com>"]
channels = ["https://prefix.dev/conda-forge", "fontan"]
name = "DROID-W-DEV"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
git-clone = "git clone git@github.com:VSLAM-LAB/DROID-W-VSLAM-LAB.git DROID-W-DEV --recursive"
build-simple-knn = { cmd = "cd thirdparty/simple-knn && python setup.py build_ext --inplace && cd ../.. && cp -r thirdparty/simple-knn/simple_knn .pixi/envs/default/lib/python3.11/site-packages/", cwd = "." }
build = { cmd = "echo 'thirdparty packages installed via pypi-dependencies'", depends-on = ["build-simple-knn"] }
execute-mono = { cmd = "python vslamlab_droidslam_wild_mono.py"}

[pypi-options]
no-build-isolation = ["diff-gaussian-rasterization", "droid-backends"]

[system-requirements]
cuda = "12.0"

[dependencies]
# Python
python = "3.11.*"
setuptools = "*"
pip = "*"

# Build Tools
compilers = "*"
cmake = "*"
make = "*"
ninja = "*"

# CUDA Build Tools
cuda-compiler = "*"
cuda-version = "12.6.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"

# CUDA Libraries
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
cusparselt = "*"
libnvjitlink = "*"

# Torch
pytorch-gpu = "*"
torchvision = "*"
torch-scatter = "*"

# Core
numpy = "<2"
pillow = "*"
imageio = "*"
joblib = "*"
pandas = "*"
scikit-image = "*"
scikit-learn = "*"
scipy = "*"
seaborn = "*"
tqdm = "*"
munch = "*"
rich = "*"
kornia = "*"
pyqt = "*"
pyglfw = "*"
pyglm = "*"
mmengine = "*"
tensorboard = "*"
evo = "*"
torchmetrics = "*"
imgviz = "*"
lpips = "*"
plyfile = "*"
timm = "==0.9.16"
pyopengl = "*"
pyrender = "*"
huggingface_hub = "*"
mmcv = "*"
rerun-sdk = "*"
eigen = "*"
lietorch = { version = "*", channel = "fontan" }

[pypi-dependencies]
diff-gaussian-rasterization = { path = "thirdparty/diff-gaussian-rasterization-w-pose", editable = true }
droid-backends = { path = ".", editable = true }
open3d = "*"
xformers = "*"
